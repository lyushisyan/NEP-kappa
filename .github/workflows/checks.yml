name: Public checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test and documentation dependencies
        run: python -m pip install -e '.[dev,docs]'
      - name: Run public tests
        env:
          OMP_NUM_THREADS: "1"
        run: python -m pytest tests/public -q
      - name: Build documentation with warnings as errors
        run: python -m sphinx -b html -W --keep-going docs/source docs/build/html
