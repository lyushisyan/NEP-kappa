name: Public checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            backend: numpy
          - python: '3.12'
            backend: numba
    env:
      OMP_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NEPKAPPA_TEST_COLLISION_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test and documentation dependencies
        run: python -m pip install -e '.[dev,docs,tdbte]'
      - name: Run public tests
        run: python -m pytest tests/public -q
      - name: Build documentation with warnings as errors
        if: matrix.backend == 'numba'
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz fonts-noto-cjk
          python -m sphinx -b html -W --keep-going docs/source docs/build/en
          python -m sphinx -b html -W --keep-going docs/zh_CN docs/build/zh_CN
