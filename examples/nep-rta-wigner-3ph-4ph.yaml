# 3C-SiC: FourPhonon Wigner_Park combines 3ph+4ph RTA scattering with
# population and coherence conductivity. Install the Wigner_Park branch.
# SiC is polar; provide a validated custom CONTROL for NAC if required.
structure:
  poscar: examples/structures/3C-SiC/POSCAR_primitive
  relaxation: true
calculator:
  name: nep
  nep-model: potentials/3C-SiC/nep_3C-SiC.txt
force-constant:
  dim-fc2: [3, 3, 3]
  dim-fc3: [3, 3, 3]
  four-phonon:
    enabled: true
    dim-fc4: [3, 3, 3]
    command: /path/to/FourPhonon-Wigner_Park/ShengBTE
kappa:
  engine: fourphonon
  mesh: [12, 12, 12]
  temps: [300]
  method-3ph: rta
  method-4ph: rta
  isotope: true
  wigner: true
plot:
  layout: both
  path: seekpath
  temperature: 300
  kappa: all
output:
  result-dir: calculations/example-runs/3c-sic-nep-rta-wigner-3ph-4ph
