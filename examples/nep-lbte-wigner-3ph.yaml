# 3C-SiC LBTE with phono3py's built-in SMM19 Wigner treatment.
structure:
  poscar: examples/structures/3C-SiC/POSCAR_primitive
  relaxation: true
calculator:
  name: nep
  nep-model: potentials/3C-SiC/nep_3C-SiC.txt
force-constant:
  dim-fc2: [3, 3, 3]
  dim-fc3: [3, 3, 3]
kappa:
  engine: phono3py
  mesh: [31, 31, 31]
  temps: [100, 1000, 50]
  method: lbte
  isotope: true
  wigner: true
plot:
  layout: both
  path: seekpath
  temperature: 300
  kappa: all
output:
  result-dir: calculations/example-runs/3c-sic-nep-lbte-wigner-3ph
