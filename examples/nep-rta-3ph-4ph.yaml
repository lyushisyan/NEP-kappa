# 3C-SiC: FourPhonon computes combined 3ph+4ph RTA conductivity.
# Polar SiC needs validated Born charges/dielectric data for NAC; the
# generated CONTROL has nonanalytic=false. Supply a custom CONTROL if needed.
structure:
  poscar: examples/structures/3C-SiC/POSCAR_primitive
  relaxation: true
calculator:
  name: nep
  nep-model: potentials/3C-SiC/nep_3C-SiC.txt
force-constant:
  dim-fc2: [3, 3, 3]
  dim-fc3: [3, 3, 3]
  four-phonon:
    enabled: true
    dim-fc4: [3, 3, 3]
    command: ShengBTE_cpu
kappa:
  engine: fourphonon
  mesh: [12, 12, 12]
  temps: [300]
  method-3ph: rta
  method-4ph: rta
  isotope: true
plot:
  layout: both
  path: seekpath
  temperature: 300
  kappa: all
output:
  result-dir: calculations/example-runs/3c-sic-nep-rta-3ph-4ph
