# Six-section TD-BTE input: generate matching FC2/FC3, then evolve phonons.
# Run from the repository root. Supercells and q mesh are illustrative only.
structure:
  poscar: examples/structures/3C-SiC/POSCAR_primitive
  relaxation: false
calculator:
  name: nep
  model: potentials/3C-SiC/nep_3C-SiC.txt
force-constant:
  dim-fc2: [3, 3, 3]
  dim-fc3: [3, 3, 3]
tdbte:
  mesh: [5, 5, 5]
  temperature: 300
  branches: [3, 4, 5]  # Zero-based optical branches for a two-atom primitive cell.
  excitation: 0.01    # Relative occupation increase, NOT kelvin or energy.
  duration-ps: 20
  max-step-ps: 0.5
  samples: 201
plot:
  layout: both
  path: seekpath
  tdbte-times: [0, 10, 20]
  dpi: 300
output:
  result-dir: calculations/3C-SiC/tdbte-from-scratch
