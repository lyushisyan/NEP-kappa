{% extends "!layout.html" %}

{% block sidebartitle %}
  {{ super() }}
  <nav class="language-switcher" aria-label="{{ language_label }}">
    {% for item in language_links %}
      {% if item.current %}
        <span lang="{{ item.code }}" aria-current="page">{{ item.label }}</span>
      {% else %}
        <a href="{{ item.url }}" lang="{{ item.code }}" hreflang="{{ item.code }}">{{ item.label }}</a>
      {% endif %}
    {% endfor %}
  </nav>
{% endblock %}
