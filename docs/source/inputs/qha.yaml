structure:
  poscar: results/harmonic/POSCAR_relaxed
  relaxation: false
calculator:
  name: nep
  model: nep_3C-SiC.txt
force-constant:
  dim-fc2: [3, 3, 3]
  qha:
    enabled: true
    run-transport: false
    equilibrium-phonons: true
    volume-ratios: [0.94, 0.97, 1.0, 1.03, 1.06]
    mesh: [31, 31, 31]
    temps: [0, 900, 100]
    relax-internal: true
plot:
  layout: both
  path: custom
  path-points:
    X: [0.5, 0.5, 0.0]
    GAMMA: [0.0, 0.0, 0.0]
    L: [0.0, 0.5, 0.0]
  path-segments: [[X, GAMMA], [GAMMA, L]]
  dpi: 300
output:
  result-dir: results/qha
